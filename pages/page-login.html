<!DOCTYPE html>
<html data-theme="mediko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register - Mediko PPDS</title>
        <script src="https://unpkg.com/@phosphor-icons/web"></script>
        <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    </head>
    <body class="min-h-screen flex font-display">
        <!-- Left Section -->
        <div class="w-full py-10 md:py-0 md:w-[50%] lg:w-[40%] flex flex-col justify-center items-center px-16">
            <div class="w-full max-w-md">
                <div class="mb-4 text-center flex items-center justify-center">
                    <img src="/assets/logo.png" alt="Mediko PPDS" class="h-16 mb-4" />
                </div>

                <form class="space-y-4">
                    <h2 class="text-xl font-semibold text-gray-800">Login to your account</h2>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-2">Email</label>
                        <input type="text" placeholder="John Doe" class="input input-bordered w-full rounded-lg" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-2">Password</label>
                        <input type="password" placeholder="*****" class="input input-bordered w-full rounded-lg" />
                    </div>

                    <div class="text-right">
                        <a href="#" class="text-sm text-secondary hover:underline text-right">Forgot Password</a>
                    </div>

                    <button class="btn btn-accent btn-lg text-white text-base font-normal w-full">Login</button>

                    <p class="text-sm text-gray-600">
                        Not registered ?
                        <a href="#" class="text-secondary hover:underline">Create account</a>
                    </p>
                </form>
            </div>
        </div>

        <!-- Right Section -->
        <div class="hidden md:block md:w-[50%] lg:w-[60%] relative">
            <img src="/assets/register-image.jpg" alt="Lab Scientist" class="w-full h-full object-cover" />
            <div class="absolute inset-0 bg-[#0072B1]/70 flex flex-col justify-center items-center text-white p-10">
                <div class="max-w-md">
                    <h2 class="text-3xl font-semibold mb-3 text-white">Experience Limitless Access to Great Learning</h2>
                    <p class="text-sm opacity-90 text-white">— Steve Jobs</p>
                </div>
            </div>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
