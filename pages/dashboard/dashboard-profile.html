<!DOCTYPE html>
<html lang="en" x-data="{ sidebarOpen: true }" xmlns="http://www.w3.org/1999/xhtml" data-theme="mediko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dashboard - Digiarch</title>
        <script src="https://unpkg.com/@phosphor-icons/web"></script>
        <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    </head>

    <body x-data="{ sidebarOpen: window.innerWidth >= 1024 }" class="h-screen flex overflow-hidden font-display">
        <!-- Sidebar -->
        <aside class="bg-[#F9FAFB] flex flex-col justify-between transition-all duration-300 h-full lg:static inset-y-0 left-0 z-40 overflow-hidden" :class="sidebarOpen ? 'w-[220px]' : 'w-0 md:w-16'">
            <!-- Sidebar Top -->
            <div class="flex flex-col h-full">
                <!-- Logo -->
                <div class="h-16 flex items-center justify-center font-bold text-xl">
                    <a href="" class="font-bold text-xl">
                        <img src="/assets/logo.png" alt="Mediko PPDS" class="w-[130px]" />
                    </a>
                </div>

                <!-- Menu -->
                <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                    <a href="./dashboard.html" class="flex items-center gap-3 p-2 rounded-lg hover:bg-base-300 active">
                        <div class="bg-[#F1F1F3] w-[22px] h-[22px] items-center rounded-sm flex justify-center">
                            <i class="ph ph-squares-four text-lg text-base-content"></i>
                        </div>
                        <span x-show="sidebarOpen" class="text-sm">Dashboard</span>
                    </a>

                    <a href="./dashboard-course.html" class="flex items-center gap-3 p-2 rounded-lg hover:bg-base-300">
                        <div class="bg-[#F1F1F3] w-[22px] h-[22px] items-center rounded-sm flex justify-center">
                            <i class="ph ph-book-bookmark text-lg text-base-content"></i>
                        </div>
                        <span x-show="sidebarOpen" class="text-sm">My Course</span>
                    </a>

                    <a href="./dashboard-materials.html" class="flex items-center gap-3 p-2 rounded-lg hover:bg-base-300">
                        <div class="bg-[#F1F1F3] w-[22px] h-[22px] items-center rounded-sm flex justify-center">
                            <i class="ph ph-notebook text-lg text-base-content"></i>
                        </div>
                        <span x-show="sidebarOpen" class="text-sm">Open Material</span>
                    </a>

                    <a href="./dashboard-tryout.html" class="flex items-center gap-3 p-2 rounded-lg hover:bg-base-300">
                        <div class="bg-[#F1F1F3] w-[22px] h-[22px] items-center rounded-sm flex justify-center">
                            <i class="ph ph-list-checks text-lg text-base-content"></i>
                        </div>
                        <span x-show="sidebarOpen" class="text-sm">Try Out</span>
                    </a>

                    <a href="./dashboard-transaction.html" class="flex items-center gap-3 p-2 rounded-lg hover:bg-base-300">
                        <div class="bg-[#F1F1F3] w-[22px] h-[22px] items-center rounded-sm flex justify-center">
                            <i class="ph ph-scroll text-lg text-base-content"></i>
                        </div>
                        <span x-show="sidebarOpen" class="text-sm">Transaction History</span>
                    </a>

                    <a href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-base-300">
                        <div class="bg-[#F1F1F3] w-[22px] h-[22px] items-center rounded-sm flex justify-center">
                            <i class="ph ph-sign-out text-lg text-base-content"></i>
                        </div>
                        <span x-show="sidebarOpen" class="text-sm">Sign Out</span>
                    </a>
                </nav>
            </div>
        </aside>

        <div x-show="sidebarOpen" x-transition.opacity @click="sidebarOpen = false" class="fixed inset-0 bg-black/50 z-30 lg:hidden"></div>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <!-- Header -->
            <header class="sticky top-0 flex items-center justify-between px-4 h-16 z-20 bg-white">
                <button @click="sidebarOpen = !sidebarOpen" class="btn border-0 bg-transparent btn-sm transition-all duration-300 ease-in-out">
                    <!-- Icon Wrapper -->
                    <span class="relative inline-block w-6 h-6">
                        <!-- Menu Icon (shown when sidebar closed) -->
                        <i
                            class="ph ph-arrow-circle-right absolute inset-0 text-xl transition-all duration-300"
                            :class="sidebarOpen ? 'opacity-0 scale-75 rotate-90' : 'opacity-100 scale-100 rotate-0'"></i>

                        <!-- X Icon (shown when sidebar open) -->
                        <i
                            class="ph ph-arrow-circle-left absolute inset-0 text-xl transition-all duration-300"
                            :class="sidebarOpen ? 'opacity-100 scale-100 rotate-0' : 'opacity-0 scale-75 -rotate-90'"></i>
                    </span>
                </button>

                <div class="dropdown dropdown-end">
                    <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar mr-2 md:mr-4">
                        <div class="w-10 rounded-full">
                            <img alt="Profile" src="https://i.pravatar.cc/100?img=3" />
                        </div>
                    </div>
                    <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-10 p-2 shadow bg-base-100 rounded-box w-56 space-y-2 shadow-soft">
                        <li class="border-b border-base-300 text-left mb-2">
                            <div class="flex flex-col items-start mb-2 gap-0">
                                <span class="font-normal text-base truncate max-w-44">Joyko Kenko</span>
                                <span class="text-sm text-gray-500 truncate max-w-44">asdasdasdasdjoyko.kenko@example.com</span>
                            </div>
                        </li>
                        <li>
                            <a href="./dashboard-profile.html" class="flex items-center gap-3 text-sm">
                                <i class="ph ph-user-circle text-base"></i>
                                Profile
                            </a>
                        </li>
                        <li>
                            <a href="./index.html" class="flex items-center gap-3 text-error text-sm">
                                <i class="ph ph-sign-out text-base"></i>
                                Sign Out
                            </a>
                        </li>
                    </ul>
                </div>
            </header>

            <!-- Page Content -->
            <div class="pt-6 pb-10 md:pb-20 lg:px-6 xl:px-10 overflow-y-auto flex-1 bg-white">
                <div class="min-h-screen mb-10">
                    <div class="container mx-auto px-4 space-y-10">
                        <div class="bg-white rounded-xl p-6 md:p-8 flex flex-col md:flex-row md:items-start gap-8">
                            <div class="md:w-1/4">
                                <h2 class="text-base font-medium text-black">Basic Info</h2>
                            </div>

                            <div class="md:w-3/4 w-full">
                                <form action="#" method="POST" class="space-y-5">
                                    <div class="space-y-5">
                                        <div>
                                            <label class="block text-sm font-medium mb-2">Full Name</label>
                                            <input type="text" class="input input-bordered w-full" value="Joyko" />
                                        </div>

                                        <div>
                                            <label class="block text-sm font-medium mb-2">Email</label>
                                            <input type="email" class="input input-bordered w-full bg-base-200" value="joyko@email.com" readonly />
                                        </div>

                                        <div>
                                            <label class="block text-sm font-medium mb-2">Date of birth</label>
                                            <input type="date" class="input input-bordered w-full" value="1995-10-21" />
                                        </div>

                                        <div>
                                            <label class="block text-sm font-medium mb-2">Domicile</label>
                                            <input type="text" class="input input-bordered w-full" value="Semarang" />
                                        </div>

                                        <div>
                                            <label class="block text-sm font-medium mb-2">Phone Number</label>
                                            <input type="text" class="input input-bordered w-full" value="+6281512345678" />
                                        </div>

                                        <div>
                                            <label class="block text-sm font-medium mb-2">University of origin</label>
                                            <select class="select select-bordered w-full">
                                                <option selected>Universitas Brawijaya</option>
                                                <option>Universitas Gadjah Mada</option>
                                                <option>Universitas Indonesia</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label class="block text-sm font-medium mb-2">Destination of PPDS University</label>
                                            <select class="select select-bordered w-full">
                                                <option selected>Universitas Missouri</option>
                                                <option>Harvard University</option>
                                                <option>Universitas Brawijaya</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label class="block text-sm font-medium mb-2">Destination of PPDS Major</label>
                                            <select class="select select-bordered w-full">
                                                <option selected>Kedokteran Gigi</option>
                                                <option>Radiologi</option>
                                                <option>Anestesi</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="pt-4">
                                        <button type="submit" class="btn btn-accent text-white w-full md:w-auto">Save Change</button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl p-6 md:p-8 flex flex-col md:flex-row md:items-start gap-8">
                            <div class="md:w-1/4">
                                <h2 class="text-base font-medium text-black">Password</h2>
                            </div>

                            <div class="md:w-3/4 w-full">
                                <form action="#" method="POST" class="space-y-5">
                                    <div>
                                        <label class="block text-sm font-medium mb-2">Old Password</label>
                                        <input type="password" class="input input-bordered w-full" placeholder="********" />
                                    </div>

                                    <div>
                                        <label class="block text-sm font-medium mb-2">New Password</label>
                                        <input type="password" class="input input-bordered w-full" placeholder="********" />
                                    </div>

                                    <div>
                                        <label class="block text-sm font-medium mb-2">Confirm New Password</label>
                                        <input type="password" class="input input-bordered w-full" placeholder="********" />
                                    </div>

                                    <div class="pt-4">
                                        <button type="submit" class="btn btn-accent text-white w-full md:w-auto">Save Password</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
